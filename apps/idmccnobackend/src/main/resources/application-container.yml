# Local container profile only. No non-local endpoints or credentials belong here.
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:idmccno}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
    username: ${DB_USER:idmccno}
    password: ${DB_PASSWORD:idmccno_local_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  task:
    scheduling:
      enabled: false

app:
  scheduling:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

keycloak:
  base-url: ${KEYCLOAK_BASE_URL:}
  realm: ${KEYCLOAK_REALM:idmccno-local}
