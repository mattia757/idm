spring:
  datasource:
    url: jdbc:h2:mem:idmccno;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  task:
    scheduling:
      enabled: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  scheduling:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
